name: PR Build Check

on:
  pull_request:
    branches: [main, dev]

# One run per PR: a new push cancels the previous run.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Scripts of every domain must at least compile (catches broken moves and imports).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I -m compileall -q scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
