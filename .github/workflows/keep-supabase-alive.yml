name: Keep Supabase alive

# The free Supabase plan pauses a project after 7 days without activity; a paused project would break
# vwapepla.org. A read with the public (publishable) key twice a week keeps it active.
# The URL and key are the public values committed in .env (read-only for the public role, RLS).

on:
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
    - cron: '0 8 * * 4' # Thursday 08:00 UTC
  workflow_dispatch: # manual run from the GitHub UI

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false
      - name: Ping Supabase REST API
        run: |
          URL=$(grep '^NEXT_PUBLIC_SUPABASE_URL=' .env | cut -d= -f2-)
          KEY=$(grep '^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2-)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/com_communes?select=code&limit=1" -H "apikey: $KEY")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Project is active."
          else
            echo "Unexpected status: the project may be paused or unreachable."
            exit 1
          fi
