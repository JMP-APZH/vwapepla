# Figures published by INSEE in a study, not in a dataset that can be downloaded by script (hand-checked, quoted).
# Same pattern as the communes' forecast YAML: figure + source URL + quote. Built into pref_context_figures.
# Why: the INSEE time series (BDM) stop in 2015 for Martinique's poverty rate, and the national open dataset
# « Taux de pauvreté » (data.gouv.fr) leaves Martinique blank.
# Read on 5 Nov 2026.

